<script type="text/html" data-template-name="langgraph-llm">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Nombre</label>
        <input type="text" id="node-input-name" placeholder="Nombre del nodo">
    </div>
    <div class="form-row">
        <label for="node-input-model"><i class="fa fa-cube"></i> Modelo</label>
        <input type="text" id="node-input-model" placeholder="groq:openai/gpt-oss-120b">
    </div>
    <div class="form-row">
        <label for="node-input-temperature"><i class="fa fa-thermometer-half"></i> Temperature</label>
        <input type="text" id="node-input-temperature" placeholder="0.7">
    </div>
    <div class="form-row">
        <label for="node-input-baseUrl"><i class="fa fa-link"></i> Base URL</label>
        <input type="text" id="node-input-baseUrl" placeholder="(opcional, solo openai-compatible) ej: http://host.docker.internal:11434/v1">
    </div>
    <div class="form-row">
        <label for="node-input-apiKey"><i class="fa fa-key"></i> API Key</label>
        <input type="password" id="node-input-apiKey">
    </div>
    <div class="form-tips">
        Formato <code>proveedor:modelo</code> (ej. <code>groq:openai/gpt-oss-120b</code>,
        <code>openai:gpt-4o-mini</code>). Sin prefijo se asume <code>openai</code>.
        Si la API Key se omite, usa <code>GROQ_API_KEY</code> u <code>OPENAI_API_KEY</code>
        del entorno según el proveedor.
    </div>
</script>

<script type="text/html" data-help-name="langgraph-llm">
    <p>
        Nodo ejecutor de LLM usando <b>LangChain</b> (<code>initChatModel</code>).
        Resuelve el modelo con formato <code>proveedor:modelo</code> (ej.
        <code>groq:openai/gpt-oss-120b</code>), restaura los mensajes
        serializados de <code>msg.state.messages</code> con
        <code>mapStoredMessagesToChatMessages</code>, invoca al modelo y añade la
        respuesta (<code>AIMessage</code>) al historial. Incrementa
        <code>msg.state.iterations</code>.
    </p>
    <h3>Configuración</h3>
    <ul>
        <li><b>Modelo</b> — formato <code>proveedor:modelo</code> (default: <code>groq:openai/gpt-oss-120b</code>).</li>
        <li><b>Temperature</b> — creatividad (default: 0.7).</li>
        <li><b>Base URL</b> — opcional; solo para endpoints compatibles con OpenAI (Ollama, vLLM...); se ignora con <code>groq:</code>.</li>
        <li><b>API Key</b> — credencial; si se omite usa <code>GROQ_API_KEY</code> o <code>OPENAI_API_KEY</code> del entorno según el proveedor.</li>
    </ul>
</script>

<script>
    RED.nodes.registerType("langgraph-llm", {
        category: "langgraph",
        color: "#4d7dd6",
        defaults: {
            name: { value: "" },
            model: { value: "groq:openai/gpt-oss-120b", required: true },
            temperature: { value: 0.7, validate: RED.validators.number(true) },
            baseUrl: { value: "" }
        },
        credentials: {
            apiKey: { type: "password" }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-comments",
        paletteLabel: "langgraph llm",
        label: function () {
            return this.name || "langgraph-llm";
        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        }
    });
</script>
