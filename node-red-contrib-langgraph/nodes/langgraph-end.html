<script type="text/html" data-template-name="langgraph-end">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Nombre</label>
        <input type="text" id="node-input-name" placeholder="Nombre del nodo">
    </div>
    <div class="form-tips">
        Marca el estado como <code>COMPLETED</code> y publica el contenido del
        último mensaje del asistente en <code>msg.payload</code>.
        Si el mensaje no trae <code>msg.state</code> (prompt chaining), lo
        reenvía sin modificar (<i>pass-through</i>).
    </div>
</script>

<script type="text/html" data-help-name="langgraph-end">
    <p>
        Punto de salida del grafo inspirado en <code>END</code> de LangGraph.
    </p>
    <p>
        Consolida el resultado final: extrae el contenido del último mensaje del
        asistente (<code>AIMessage</code>) a <code>msg.payload</code>, y cambia
        <code>msg.state.status</code> a <code>COMPLETED</code> y
        <code>next_node</code> a <code>null</code>.
    </p>
    <p>
        El objeto completo <code>msg.state</code> (historial incluido) se
        conserva en el mensaje para inspección o para nodos posteriores.
    </p>
    <p>
        Si el mensaje llega <b>sin</b> <code>msg.state</code> (por ejemplo en un
        flujo de <b>prompt chaining</b>, donde el LLM escribe su respuesta en
        <code>msg.payload</code>), el nodo actúa como <i>pass-through</i>: no
        modifica nada y reenvía el mensaje. Así sirve también como cierre de
        cadenas sin grafo.
    </p>
</script>

<script>
    RED.nodes.registerType("langgraph-end", {
        category: "langgraph",
        color: "#e36157",
        defaults: {
            name: { value: "" }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-flag-checkered",
        paletteLabel: "langgraph end",
        label: function () {
            return this.name || "langgraph-end";
        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        }
    });
</script>
